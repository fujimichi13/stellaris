

iris.features.required = CUSTOM_IMAGES

texture.noise= texture/noise.png

image.histX = samplerHistX red_integer r32ui unsigned_int true false 512 1
image.histY = samplerHistY red_integer r32ui unsigned_int true false 512 1
image.warpX = samplerWarpX red r32f float false false 512 1
image.warpY = samplerWarpY red r32f float false false 512 1

image.transmittanceLut = samplerTransmittance rgba rgba32f float false false 256 64
image.skyLut = samplerSky rgba rgba32f float false false 256 128
image.causticLut = samplerCaustic rgba rgba16f half_float false false 512 512

image.cloudHistA = samplerCloudA rgba rgba16f half_float false true 1.0 1.0
image.cloudHistB = samplerCloudB rgba rgba16f half_float false true 1.0 1.0

customTexture.noisetex1=texture/noise1.png
clouds=off
oldLighting=false
shadow.culling=false
shadow.enabled= true

blend.shadow=off
blend.gbuffers_water=off
blend.gbuffers_entities=off
blend.gbuffers_entities_translucent=off
blend.gbuffers_block=off
blend.gbuffers_block_translucent=off

scale.composite1=0.5
size.buffer.colortex9=0.5 0.5
size.buffer.colortex10=0.25 0.25
size.buffer.colortex11=0.125 0.125
size.buffer.colortex12=0.0625 0.0625

#ifdef BLOOM
    program.world0/composite5.enabled=true
    program.world0/composite6.enabled=true
    program.world0/composite7.enabled=true
    program.world0/composite8.enabled=true
    program.world0/composite9.enabled=true
    program.world0/composite10.enabled=true
#else
    program.world0/composite5.enabled=false
    program.world0/composite6.enabled=false
    program.world0/composite7.enabled=false
    program.world0/composite8.enabled=false
    program.world0/composite9.enabled=false
    program.world0/composite10.enabled=false
#endif

#ifdef TAA_ENABLED
    program.world0/composite5.enabled=true
#else
    program.world0/composite5.enabled=false
#endif

variable.int.frameMod16 = frameCounter % 16

variable.float.jitterX=if(frameMod16==0,0.0, \
                          frameMod16==1,-0.5, \
                          frameMod16==2,0.5, \
                          frameMod16==3,-0.75, \
                          frameMod16==4,0.25, \
                          frameMod16==5,-0.25, \
                          frameMod16==6,0.75, \
                          frameMod16==7,-0.875, \
                          frameMod16==8,0.125, \
                          frameMod16==9,-0.375, \
                          frameMod16==10,0.625, \
                          frameMod16==11,-0.625, \
                          frameMod16==12,0.375, \
                          frameMod16==13,-0.125, \
                          frameMod16==14,0.875,-0.9375)

variable.float.jitterY=if(frameMod16==0,-0.3333333, \
                          frameMod16==1,0.3333333, \
                          frameMod16==2,-0.7777778, \
                          frameMod16==3,-0.1111111, \
                          frameMod16==4,0.5555556, \
                          frameMod16==5,-0.5555556, \
                          frameMod16==6,0.1111111, \
                          frameMod16==7,0.7777778, \
                          frameMod16==8,-0.9259259, \
                          frameMod16==9,-0.2592593, \
                          frameMod16==10,0.4074074, \
                          frameMod16==11,-0.7037037, \
                          frameMod16==12,-0.0370370, \
                          frameMod16==13,0.6296296, \
                          frameMod16==14,-0.4814815,0.1851852)


uniform.vec2.taaJitter=vec2(jitterX/viewWidth,jitterY/viewHeight)
uniform.vec2.taaJitterU=vec2(jitterX/(viewWidth*TAAU_RENDER_SCALE),jitterY/(viewHeight*TAAU_RENDER_SCALE))

#ifdef TAAU_ENABLED
    scale.deferred=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
    scale.composite=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
    scale.composite2=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
    scale.composite3=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
    scale.composite4=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
#endif

variable.bool.celestial = (blindness > 0.0) || (isEyeInWater == 3)

variable.float.viewSunDirNorm = 1.0 / sqrt((sunPosition.x * sunPosition.x) + (sunPosition.y * sunPosition.y) + (sunPosition.z * sunPosition.z))
variable.float.viewSunDirX = sunPosition.x * viewSunDirNorm
variable.float.viewSunDirY = sunPosition.y * viewSunDirNorm
variable.float.viewSunDirZ = sunPosition.z * viewSunDirNorm
uniform.vec3.viewSunDir = vec3(viewSunDirX, viewSunDirY, viewSunDirZ)

variable.float.sunDirX = gbufferModelViewInverse.0.0 * viewSunDirX + gbufferModelViewInverse.1.0 * viewSunDirY + gbufferModelViewInverse.2.0 * viewSunDirZ
variable.float.sunDirY = gbufferModelViewInverse.0.1 * viewSunDirX + gbufferModelViewInverse.1.1 * viewSunDirY + gbufferModelViewInverse.2.1 * viewSunDirZ
variable.float.sunDirZ = gbufferModelViewInverse.0.2 * viewSunDirX + gbufferModelViewInverse.1.2 * viewSunDirY + gbufferModelViewInverse.2.2 * viewSunDirZ
uniform.vec3.sunDir = vec3(if(celestial, viewSunDirX, sunDirX), if(celestial, viewSunDirY, sunDirY), if(celestial, viewSunDirZ, sunDirZ))

# https://www.desmos.com/calculator/kniltwna7u
uniform.float.me_fade = if(sunDirY < 0.18, 0.37 + 1.2 * max(0.0, -sunDirY), 1.7)
uniform.float.me_weight = pow(clamp(1.0 - me_fade * abs(sunDirY - 0.18), 0.0, 1.0), 2.0)
uniform.float.timeSunrise = if(sunDirX > 0.0, 1.0, 0.0) * me_weight
uniform.float.timeNoon = if(sunDirY > 0.0, 1.0, 0.0) * (1.0 - me_weight)
uniform.float.timeMidnight = if(sunDirY < 0.0, 1.0, 0.0) * (1.0 - me_weight)
uniform.float.timeSunset = if(sunDirX < 0.0, 1.0, 0.0) * me_weight

screen=TAA_ENABLED TAAU_ENABLED TAAU_RENDER_SCALE