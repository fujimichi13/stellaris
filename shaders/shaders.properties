#endif

variable.int.frameMod16=frameCounter % 16

variable.float.jitterX=if(frameMod16==0,0.0, \
                          frameMod16==1,-0.5, \
                          frameMod16==2,0.5, \
                          frameMod16==3,-0.75, \
                          frameMod16==4,0.25, \
                          frameMod16==5,-0.25, \
                          frameMod16==6,0.75, \
                          frameMod16==7,-0.875, \
                          frameMod16==8,0.125, \
                          frameMod16==9,-0.375, \
                          frameMod16==10,0.625, \
                          frameMod16==11,-0.625, \
                          frameMod16==12,0.375, \
                          frameMod16==13,-0.125, \
                          frameMod16==14,0.875,-0.9375)

variable.float.jitterY=if(frameMod16==0,-0.3333333, \
                          frameMod16==1,0.3333333, \
                          frameMod16==2,-0.7777778, \
                          frameMod16==3,-0.1111111, \
                          frameMod16==4,0.5555556, \
                          frameMod16==5,-0.5555556, \
                          frameMod16==6,0.1111111, \
                          frameMod16==7,0.7777778, \
                          frameMod16==8,-0.9259259, \
                          frameMod16==9,-0.2592593, \
                          frameMod16==10,0.4074074, \
                          frameMod16==11,-0.7037037, \
                          frameMod16==12,-0.0370370, \
                          frameMod16==13,0.6296296, \
                          frameMod16==14,-0.4814815,0.1851852)

#ifdef TAAU_ENABLED
    uniform.vec2.taaJitter=vec2(jitterX/(viewWidth*TAAU_RENDER_SCALE),jitterY/(viewHeight*TAAU_RENDER_SCALE))

    scale.deferred=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
    scale.composite=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
    scale.composite2=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
    scale.composite3=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
    scale.composite4=TAAU_RENDER_SCALE TAAU_RENDER_SCALE
#else
    uniform.vec2.taaJitter=vec2(jitterX/viewWidth,jitterY/viewHeight)
#endif

screen=INFO VOXELIZE_PLAYER 
screen.columns=2