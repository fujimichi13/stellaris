

iris.features.required = CUSTOM_IMAGES

texture.noise= texture/noise.png

image.histX = samplerHistX red_integer r32ui unsigned_int true false 512 1
image.histY = samplerHistY red_integer r32ui unsigned_int true false 512 1
image.warpX = samplerWarpX red r32f float false false 512 1
image.warpY = samplerWarpY red r32f float false false 512 1

image.transmittanceLut = samplerTransmittance rgba rgba32f float false false 256 64
image.skyLut = samplerSky rgba rgba32f float false false 256 128
image.causticLut = samplerCaustic rgba rgba16f half_float false false 512 512

customTexture.noisetex1=texture/noise1.png
clouds=off
oldLighting=false
shadow.culling=false
shadow.enabled= true

blend.shadow=off
blend.gbuffers_water=off
blend.gbuffers_entities=off
blend.gbuffers_entities_translucent=off
blend.gbuffers_block=off
blend.gbuffers_block_translucent=off

scale.composite1=0.5
size.buffer.colortex9=0.5 0.5
size.buffer.colortex10=0.25 0.25
size.buffer.colortex11=0.125 0.125
size.buffer.colortex12=0.0625 0.0625

#ifdef BLOOM
    program.world0/composite5.enabled=true
    program.world0/composite6.enabled=true
    program.world0/composite7.enabled=true
    program.world0/composite8.enabled=true
    program.world0/composite9.enabled=true
    program.world0/composite10.enabled=true
#else
    program.world0/composite5.enabled=false
    program.world0/composite6.enabled=false
    program.world0/composite7.enabled=false
    program.world0/composite8.enabled=false
    program.world0/composite9.enabled=false
    program.world0/composite10.enabled=false
#endif

#ifdef TAA_ENABLED
    program.world0/composite5.enabled=true
#else
    program.world0/composite5.enabled=false
#endif

variable.int.taaIdx = frameCounter % 16

variable.float.jitterX=if(taaIdx==0,0.0, \
                          taaIdx==1,-0.5, \
                          taaIdx==2,0.5, \
                          taaIdx==3,-0.75, \
                          taaIdx==4,0.25, \
                          taaIdx==5,-0.25, \
                          taaIdx==6,0.75, \
                          taaIdx==7,-0.875, \
                          taaIdx==8,0.125, \
                          taaIdx==9,-0.375, \
                          taaIdx==10,0.625, \
                          taaIdx==11,-0.625, \
                          taaIdx==12,0.375, \
                          taaIdx==13,-0.125, \
                          taaIdx==14,0.875,-0.9375)

variable.float.jitterY=if(taaIdx==0,-0.3333333, \
                          taaIdx==1,0.3333333, \
                          taaIdx==2,-0.7777778, \
                          taaIdx==3,-0.1111111, \
                          taaIdx==4,0.5555556, \
                          taaIdx==5,-0.5555556, \
                          taaIdx==6,0.1111111, \
                          taaIdx==7,0.7777778, \
                          taaIdx==8,-0.9259259, \
                          taaIdx==9,-0.2592593, \
                          taaIdx==10,0.4074074, \
                          taaIdx==11,-0.7037037, \
                          taaIdx==12,-0.0370370, \
                          taaIdx==13,0.6296296, \
                          taaIdx==14,-0.4814815,0.1851852)

#ifdef TAAU_ENABLED
    uniform.vec2.taaJitter=vec2(jitterX/(viewWidth*TAAU_RENDER_SCALE),jitterY/(viewHeight*TAAU_RENDER_SCALE))

    scale.deferred=TAAU_RENDER_SCALE
    scale.composite=TAAU_RENDER_SCALE
    scale.composite2=TAAU_RENDER_SCALE
    scale.composite3=TAAU_RENDER_SCALE
    scale.composite4=TAAU_RENDER_SCALE
#else
    uniform.vec2.taaJitter=vec2(jitterX/viewWidth,jitterY/viewHeight)
#endif

screen=TAA_ENABLED TAAU_ENABLED TAAU_RENDER_SCALE COLORED_SHADOW RSM_ENABLED BLOOM